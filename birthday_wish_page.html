<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎉</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
      animation: pop 0.6s ease-out;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2.5em;
      color: #ff4b5c;
    }
    p {
      font-size: 1.2em;
      color: #444;
    }
    .balloons {
      position: absolute;
      bottom: -150px;
      width: 100%;
      display: flex;
      justify-content: space-around;
    }
    .balloon {
      width: 80px;
      height: 100px;
      background: #ff4b5c;
      border-radius: 50%;
      animation: float 6s infinite ease-in;
      opacity: 0.7;
    }
    .balloon:nth-child(2) { background: #ffd93d; animation-delay: 1s; }
    .balloon:nth-child(3) { background: #6bcB77; animation-delay: 2s; }
    .balloon:nth-child(4) { background: #4d96ff; animation-delay: 3s; }

    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-120vh); }
    }
    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Happy Birthday! 🎂</h1>
    <p>Wishing you a day filled with happiness, laughter, and everything you love 💖</p>
    <p>May all your dreams come true ✨</p>
  </div>

  <div class="balloons">
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
  </div>
</body>
</html>
