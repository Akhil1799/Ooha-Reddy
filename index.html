<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Ooha 🎉</title>

  <style>
    :root{
      --bg1:#070A12;
      --bg2:#111A2B;
      --gold:#D8B15A;
      --cream:#F5F0E6;
      --accent:#FF4B5C;
    }
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 800px at 50% 25%, rgba(216,177,90,0.14), transparent 55%),
        radial-gradient(900px 700px at 20% 85%, rgba(255,75,92,0.10), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color:var(--cream);
      padding:22px;
      overflow-x:hidden;
      overflow-y:auto;
    }

    /* 🎀 + 🎈 background layers (behind everything) */
    #ribbons, #confetti{
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    #ribbons{ opacity: 0.82; }
    #confetti{ opacity: 1; }

    .balloons{
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.62; /* a bit more visible */
      filter: saturate(1.05);
    }
    .balloon{
      position:absolute;
      left: calc(var(--x) * 1%);
      bottom: -180px;
      width: calc(var(--size) * 1px);
      height: calc(var(--size) * 1.28px);
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.85), rgba(255,255,255,0.0) 35%),
        var(--c);
      border-radius: 50% 50% 48% 48%;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,0.38));
      transform: translateX(0) rotate(0deg);
      animation:
        floatUp calc(var(--dur) * 1s) linear infinite,
        sway calc(var(--sway) * 1s) ease-in-out infinite;
    }
    .balloon::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-12px;
      width:16px;
      height:14px;
      background: rgba(0,0,0,0.12);
      transform: translateX(-50%) rotate(45deg);
      border-radius: 3px;
      opacity: 0.32;
    }
    .string{
      position:absolute;
      left:50%;
      top:100%;
      width:2px;
      height:130px;
      background: rgba(245,240,230,0.32);
      transform: translateX(-50%);
      border-radius: 999px;
    }
    @keyframes floatUp{
      0%{ transform: translateY(0); opacity: 0; }
      10%{ opacity: 1; }
      90%{ opacity: 1; }
      100%{ transform: translateY(calc(-120vh)); opacity: 0; }
    }
    @keyframes sway{
      0%{ margin-left: 0px; rotate: -2deg; }
      50%{ margin-left: 22px; rotate: 2deg; }
      100%{ margin-left: 0px; rotate: -2deg; }
    }

    .card{
      width:min(980px, 96vw);
      padding:38px;
      border-radius:24px;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(216,177,90,0.30);
      box-shadow: 0 25px 70px rgba(0,0,0,0.60);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1; /* above ribbons/balloons */
    }

    h1{ margin:0 0 18px; font-size:clamp(30px, 4.2vw, 46px); text-align:center; }
    .gold{ color: var(--gold); }

    .layout{ display:grid; grid-template-columns: 1.1fr 0.9fr; gap:28px; align-items:start; }
    @media (max-width: 900px){ .layout{ grid-template-columns: 1fr; } }

    .message{
      border:1px dashed rgba(216,177,90,0.45);
      padding:22px;
      border-radius:16px;
      background: rgba(0,0,0,0.18);
      line-height:1.7;
      font-size:15.5px;
      white-space:pre-wrap;
      min-height:210px;
    }
    .placeholder{ opacity:0.72; }

    .cursor{
      display:none;
      width:10px; height:18px;
      background: rgba(245,240,230,0.65);
      margin-left:6px;
      animation: blink .8s infinite;
      vertical-align:middle;
    }
    @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .btnRow{ margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn{
      border:1px solid rgba(216,177,90,0.45);
      background: rgba(0,0,0,0.25);
      color: var(--cream);
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      font-weight:800;
    }

    .status{ margin-top:10px; font-size:12.5px; opacity:.88; }

    .photoWrap{
      margin-top:14px;
      display:none;
      border-radius:16px;
      overflow:hidden;
      border:1px solid rgba(216,177,90,0.28);
      background: rgba(255,255,255,0.03);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
