<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Ooha 🎉</title>

  <style>
    :root{
      --bg1:#070A12;
      --bg2:#111A2B;
      --gold:#D8B15A;
      --cream:#F5F0E6;
      --accent:#FF4B5C;
    }
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 800px at 50% 25%, rgba(216,177,90,0.14), transparent 55%),
        radial-gradient(900px 700px at 20% 85%, rgba(255,75,92,0.10), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color:var(--cream);
      padding:22px;
      overflow-x:hidden;
      overflow-y:auto;
    }

    .card{
      width:min(980px, 96vw);
      padding:38px;
      border-radius:24px;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(216,177,90,0.30);
      box-shadow: 0 25px 70px rgba(0,0,0,0.60);
      backdrop-filter: blur(10px);
    }

    h1{ margin:0 0 18px; font-size:clamp(30px, 4.2vw, 46px); text-align:center; }
    .gold{ color: var(--gold); }

    .layout{ display:grid; grid-template-columns: 1.1fr 0.9fr; gap:28px; align-items:start; }
    @media (max-width: 900px){ .layout{ grid-template-columns: 1fr; } }

    .message{
      border:1px dashed rgba(216,177,90,0.45);
      padding:22px;
      border-radius:16px;
      background: rgba(0,0,0,0.18);
      line-height:1.7;
      font-size:15.5px;
      white-space:pre-wrap;
      min-height:210px;
    }
    .placeholder{ opacity:0.72; }

    .cursor{
      display:none;
      width:10px; height:18px;
      background: rgba(245,240,230,0.65);
      margin-left:6px;
      animation: blink .8s infinite;
      vertical-align:middle;
    }
    @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .btnRow{ margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn{
      border:1px solid rgba(216,177,90,0.45);
      background: rgba(0,0,0,0.25);
      color: var(--cream);
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      font-weight:800;
    }

    .status{ margin-top:10px; font-size:12.5px; opacity:.88; }

    .photoWrap{
      margin-top:14px;
      display:none;
      border-radius:16px;
      overflow:hidden;
      border:1px solid rgba(216,177,90,0.28);
      background: rgba(255,255,255,0.03);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      transform: translateY(10px) scale(0.98);
      opacity:0;
    }
    .photoWrap.show{ display:block; animation: photoIn .55s ease-out forwards; }
    @keyframes photoIn{ to { transform: translateY(0) scale(1); opacity:1; } }

    .photoWrap img{
      width:100%;
      height:auto;
      max-height:560px;
      object-fit:contain;
      display:block;
      background: rgba(0,0,0,0.18);
    }
    .photoCaption{
      padding:10px 12px;
      font-size:13px;
      opacity:0.88;
      border-top:1px solid rgba(216,177,90,0.18);
      background: rgba(0,0,0,0.20);
    }

    .art{ display:flex; justify-content:center; align-items:center; position:relative; }
    .penguinStage{ position:relative; display:flex; justify-content:center; align-items:center; padding:30px; border-radius:28px; }
    .penguinStage::before{
      content:"";
      position:absolute; inset:0;
      border-radius:28px;
      background:
        radial-gradient(circle at 50% 40%, rgba(255,75,92,0.35), transparent 60%),
        radial-gradient(circle at 60% 60%, rgba(216,177,90,0.35), transparent 65%),
        radial-gradient(circle at 40% 70%, rgba(90,220,255,0.25), transparent 65%);
      filter: blur(18px);
      opacity:0.9;
      z-index:0;
    }
    .penguinBtn{
      border:0; background:transparent; padding:0;
      cursor:pointer;
      position:relative; z-index:1;
      transform-origin: 50% 85%;
      animation: dance 1.2s ease-in-out infinite;
    }
    .penguinImg{
      width:min(360px, 80%);
      height:auto;
      display:block;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,0.45));
      user-select:none; -webkit-user-drag:none;
    }
    @keyframes dance{
      0%{transform: translateY(6px) rotate(-2deg) scale(1);}
      25%{transform: translateY(-7px) rotate(2deg) scale(1.02);}
      50%{transform: translateY(6px) rotate(0deg) scale(1);}
      75%{transform: translateY(-7px) rotate(-2deg) scale(1.02);}
      100%{transform: translateY(6px) rotate(-2deg) scale(1);}
    }
    .party{ animation: partyDance .75s cubic-bezier(.2,.9,.2,1) 1 !important; }
    @keyframes partyDance{
      0%{transform: translateY(6px) rotate(-2deg) scale(1);}
      35%{transform: translateY(-26px) rotate(10deg) scale(1.07);}
      65%{transform: translateY(2px) rotate(-12deg) scale(1.04);}
      100%{transform: translateY(6px) rotate(-2deg) scale(1);}
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Happy Birthday, <span class="gold">Ooha</span> 🎂</h1>

    <div class="layout">
      <div>
        <div class="message">
          <span id="typed" class="placeholder">💌 Click “Open Message” to reveal your birthday wish…</span>
          <span id="cursor" class="cursor"></span>
        </div>

        <div class="btnRow">
          <button id="openBtn" class="btn">💌 Open Message</button>
          <button id="replayBtn" class="btn" style="display:none;">↻ Replay</button>
          <button id="photoBtn" class="btn">🖼️ Open Photo Surprise</button>
          <button id="musicBtn" class="btn">🎵 Play Song</button>
        </div>

        <div id="musicStatus" class="status"></div>

        <div id="photoWrap" class="photoWrap">
          <img src="./surprise-photo.png" alt="Photo surprise">
          <div class="photoCaption">✨ A little memory for you, Ooha ✨</div>
        </div>

        <!-- ✅ MP3 MUST be named: song.mp3 -->
        <audio id="bgMusic" preload="auto">
          <source src="./song.mp3" type="audio/mpeg">
        </audio>
      </div>

      <div class="art">
        <div class="penguinStage">
          <button class="penguinBtn" id="penguinBtn" aria-label="Dancing 3D penguin">
            <img class="penguinImg" src="./penguin-3d.png" alt="Cute 3D Penguin">
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const message = `Happy happy birthday, my kothi fellow 😊
To one of the most stubborn, driven, and inspiring women I know, your dedication to your dreams is honestly something I admire so much. Stay the same beautiful, hardworking, and strong person you are. Keep chasing your success, because you’re made for amazing things.
Have a day as special as you are. Meet you soon ❤️`;

    const typed = document.getElementById("typed");
    const cursor = document.getElementById("cursor");
    const openBtn = document.getElementById("openBtn");
    const replayBtn = document.getElementById("replayBtn");

    let timer = null;
    let isTyping = false;

    function startTyping(){
      if (isTyping) return;
      isTyping = true;

      clearInterval(timer);
      typed.classList.remove("placeholder");
      typed.textContent = "";
      cursor.style.display = "inline-block";

      openBtn.style.display = "none";
      replayBtn.style.display = "inline-block";

      let i = 0;
      timer = setInterval(() => {
        typed.textContent += message.charAt(i);
        i++;
        if(i >= message.length){
          clearInterval(timer);
          cursor.style.display = "none";
          isTyping = false;
        }
      }, 16);
    }

    function replay(){
      clearInterval(timer);
      isTyping = false;
      startTyping();
    }

    openBtn.addEventListener("click", startTyping);
    replayBtn.addEventListener("click", replay);

    const photoBtn = document.getElementById("photoBtn");
    const photoWrap = document.getElementById("photoWrap");
    photoBtn.addEventListener("click", () => {
      const isOpen = photoWrap.classList.toggle("show");
      photoBtn.textContent = isOpen ? "🙈 Hide Photo Surprise" : "🖼️ Open Photo Surprise";
    });

    const penguinBtn = document.getElementById("penguinBtn");
    penguinBtn.addEventListener("click", () => {
      penguinBtn.classList.remove("party");
      void penguinBtn.offsetWidth;
      penguinBtn.classList.add("party");
    });

    const musicBtn = document.getElementById("musicBtn");
    const bgMusic = document.getElementById("bgMusic");
    const musicStatus = document.getElementById("musicStatus");
    let musicOn = false;

    bgMusic.addEventListener("error", () => {
      musicStatus.textContent = "⚠️ Audio failed to load. Make sure the file is named exactly: song.mp3 (in repo root).";
    });

    musicBtn.addEventListener("click", async () => {
      try {
        if (!musicOn) {
          musicStatus.textContent = "Loading song…";
          bgMusic.volume = 0.55;
          bgMusic.loop = true;
          await bgMusic.play();
          musicOn = true;
          musicBtn.textContent = "⏸ Pause Song";
          musicStatus.textContent = "🎶 Playing…";
        } else {
          bgMusic.pause();
          musicOn = false;
          musicBtn.textContent = "🎵 Play Song";
          musicStatus.textContent = "Paused.";
        }
      } catch (e) {
        musicStatus.textContent = "⚠️ Couldn’t play. Try hard refresh (Cmd+Shift+R) after you rename to song.mp3.";
        console.error(e);
      }
    });
  </script>
</body>
</html>
