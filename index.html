<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Ooha 🎉</title>

  <style>
    :root{
      --bg1:#070A12;
      --bg2:#111A2B;
      --gold:#D8B15A;
      --cream:#F5F0E6;
      --accent:#FF4B5C;
    }
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 800px at 50% 25%, rgba(216,177,90,0.14), transparent 55%),
        radial-gradient(900px 700px at 20% 85%, rgba(255,75,92,0.10), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color:var(--cream);
      padding:22px;
      overflow-x:hidden;
      overflow-y:auto;
    }

    #ribbons, #confetti{
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .balloons{
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.6;
    }

    .balloon{
      position:absolute;
      left: calc(var(--x) * 1%);
      bottom: -200px;
      width: calc(var(--size) * 1px);
      height: calc(var(--size) * 1.3px);
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.85), transparent 35%),
        var(--c);
      border-radius: 50%;
      animation: floatUp calc(var(--dur) * 1s) linear infinite;
    }

    .string{
      position:absolute;
      left:50%;
      top:100%;
      width:2px;
      height:140px;
      background: rgba(245,240,230,0.3);
      transform: translateX(-50%);
    }

    @keyframes floatUp{
      from{ transform: translateY(0); opacity:0; }
      to{ transform: translateY(-130vh); opacity:1; }
    }

    .card{
      width:min(980px, 96vw);
      padding:38px;
      border-radius:24px;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(216,177,90,0.30);
      box-shadow: 0 25px 70px rgba(0,0,0,0.60);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
    }

    h1{ margin:0 0 18px; font-size:clamp(30px, 4.2vw, 46px); text-align:center; }
    .gold{ color: var(--gold); }

    .message{
      border:1px dashed rgba(216,177,90,0.45);
      padding:22px;
      border-radius:16px;
      background: rgba(0,0,0,0.18);
      line-height:1.7;
      font-size:15.5px;
      white-space:pre-wrap;
      min-height:210px;
    }

    .btnRow{ margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; }

    .btn{
      border:1px solid rgba(216,177,90,0.45);
      background: rgba(0,0,0,0.25);
      color: var(--cream);
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      font-weight:800;
    }

    .photoWrap{ display:none; margin-top:14px; }
    .photoWrap.show{ display:block; }

    .penguinImg{
      width:min(360px, 80%);
      animation: dance 1.2s ease-in-out infinite;
    }

    @keyframes dance{
      0%{transform: translateY(6px);}
      50%{transform: translateY(-10px);}
      100%{transform: translateY(6px);}
    }
  </style>
</head>

<body>
  <canvas id="ribbons"></canvas>
  <canvas id="confetti"></canvas>
  <div class="balloons" id="balloons"></div>

  <div class="card">
    <h1>Happy Birthday, <span class="gold">Ooha</span> 🎂</h1>

    <div class="message">
      <span id="typed">💌 Click “Open Message”…</span>
    </div>

    <div class="btnRow">
      <button id="openBtn" class="btn">💌 Open Message</button>
      <button id="photoBtn" class="btn">🖼️ Open Photo</button>
      <button id="musicBtn" class="btn">🎵 Play Song</button>
    </div>

    <div id="photoWrap" class="photoWrap">
      <img src="./surprise-photo.png" width="100%">
    </div>

    <audio id="bgMusic">
      <source src="./song.mp3" type="audio/mpeg">
    </audio>

    <div style="text-align:center; margin-top:20px;">
      <img id="penguinBtn" class="penguinImg" src="./penguin-3d.png">
    </div>
  </div>

  <script>
    const message = `Happy Happy Birthday 🎂🎈, kothi fellow ☺️
To one of the most adorably headstrong, driven, and inspiring women I know, your dedication to your dreams is honestly something I admire so much. Stay the same beautiful, hardworking, and strong person you are. Keep believing in yourself and going after everything you want. You’re made for amazing things, and I’ll always be cheering for you. Keep chasing your success, because you truly deserve every bit of it.
Have a day as special as you are. Meet you soon ❤️`;

    const typed = document.getElementById("typed");
    const openBtn = document.getElementById("openBtn");

    openBtn.onclick = () => {
      typed.textContent = "";
      let i = 0;
      const timer = setInterval(() => {
        typed.textContent += message.charAt(i);
        i++;
        if(i >= message.length) clearInterval(timer);
      }, 38); // ✨ cinematic speed
    };

    const photoBtn = document.getElementById("photoBtn");
    const photoWrap = document.getElementById("photoWrap");
    photoBtn.onclick = () => photoWrap.classList.toggle("show");

    const musicBtn = document.getElementById("musicBtn");
    const bgMusic = document.getElementById("bgMusic");
    let playing = false;

    musicBtn.onclick = async () => {
      if(!playing){
        await bgMusic.play();
        playing = true;
        musicBtn.textContent = "⏸ Pause Song";
      } else {
        bgMusic.pause();
        playing = false;
        musicBtn.textContent = "🎵 Play Song";
      }
    };

    const penguinBtn = document.getElementById("penguinBtn");
    penguinBtn.onclick = burstConfetti;

    function burstConfetti(){
      const ctx = document.getElementById("confetti").getContext("2d");
      const W = window.innerWidth;
      const H = window.innerHeight;
      for(let i=0;i<80;i++){
        ctx.fillStyle = ["#D8B15A","#FF4B5C","#6AD7FF"][Math.floor(Math.random()*3)];
        ctx.fillRect(Math.random()*W, Math.random()*H, 6, 6);
      }
      setTimeout(() => ctx.clearRect(0,0,W,H), 500);
    }

    (function spawnBalloons(){
      const wrap = document.getElementById("balloons");
      for(let i=0;i<12;i++){
        const b = document.createElement("div");
        b.className = "balloon";
        b.style.setProperty("--x", Math.random()*100);
        b.style.setProperty("--size", 60 + Math.random()*40);
        b.style.setProperty("--dur", 18 + Math.random()*10);
        b.style.setProperty("--c", "rgba(255,75,92,0.85)");
        const s = document.createElement("div");
        s.className = "string";
        b.appendChild(s);
        wrap.appendChild(b);
      }
    })();
  </script>
</body>
</html>
