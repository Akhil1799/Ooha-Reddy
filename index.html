<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Ooha 🎉</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #070A12, #111A2B);
      color:white;
    }

    .card{
      width:90%;
      max-width:900px;
      padding:40px;
      border-radius:20px;
      background: rgba(255,255,255,0.05);
      border:1px solid rgba(216,177,90,0.3);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    h1{
      margin-top:0;
      font-size:42px;
    }

    .gold{ color:#D8B15A; }

    .layout{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:20px;
      align-items:center;
    }

    .message{
      border:1px dashed rgba(216,177,90,0.4);
      padding:20px;
      border-radius:12px;
    }

    svg{
      width:100%;
      max-width:320px;
      margin:auto;
      display:block;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Happy Birthday, <span class="gold">Ooha</span> 🎂</h1>

    <div class="layout">
      <div class="message">
        <h3>Your message goes here</h3>
        <p>
          Add your birthday message and I’ll customize it perfectly ✨
        </p>
      </div>

      <div>
        <svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="210" cy="388" rx="120" ry="22" fill="rgba(0,0,0,0.35)"/>

          <g>
            <ellipse cx="210" cy="250" rx="120" ry="150" fill="#0C0F18"/>
            <ellipse cx="210" cy="268" rx="82" ry="118" fill="#F5F0E6"/>

            <ellipse cx="210" cy="154" rx="92" ry="86" fill="#0C0F18"/>
            <ellipse cx="210" cy="162" rx="64" ry="56" fill="#F5F0E6"/>

            <circle cx="186" cy="148" r="10" fill="#111A2B"/>
            <circle cx="234" cy="148" r="10" fill="#111A2B"/>

            <path d="M210 160 L192 176 Q210 192 228 176 Z" fill="#F2A83B"/>

            <path d="M210 206 L186 194 L178 206 L186 218 Z" fill="#FF4B5C"/>
            <path d="M210 206 L234 194 L242 206 L234 218 Z" fill="#FF4B5C"/>
          </g>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
