<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Ooha 🎉</title>

  <style>
    :root{
      --bg1:#070A12;
      --bg2:#111A2B;
      --gold:#D8B15A;
      --cream:#F5F0E6;
      --accent:#FF4B5C;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 800px at 50% 25%, rgba(216,177,90,0.14), transparent 55%),
        radial-gradient(900px 700px at 20% 85%, rgba(255,75,92,0.10), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color:var(--cream);
      overflow:hidden;
      padding:22px;
    }

    .card{
      width:min(980px, 96vw);
      padding:38px;
      border-radius:24px;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(216,177,90,0.30);
      box-shadow: 0 25px 70px rgba(0,0,0,0.60);
      backdrop-filter: blur(10px);
      position:relative;
      overflow:hidden;
    }

    h1{
      margin:0 0 18px;
      font-size:clamp(30px, 4.2vw, 46px);
    }
    .gold{ color: var(--gold); }

    .layout{
      display:grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap:22px;
      align-items:start;
    }
    @media (max-width: 900px){
      .layout{ grid-template-columns: 1fr; }
    }

    .message{
      border:1px dashed rgba(216,177,90,0.45);
      padding:22px;
      border-radius:16px;
      background: rgba(0,0,0,0.18);
      line-height:1.7;
      font-size:15.5px;
      white-space:pre-wrap;
    }

    .cursor{
      display:inline-block;
      width:10px;
      height:18px;
      background: rgba(245,240,230,0.65);
      margin-left:6px;
      animation: blink .8s infinite;
    }
    @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .btn{
      margin-top:12px;
      border:1px solid rgba(216,177,90,0.45);
      background: rgba(0,0,0,0.25);
      color: var(--cream);
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      font-weight:700;
    }

    .art{
      position:relative;
      border-radius:18px;
      padding:16px;
      border:1px solid rgba(216,177,90,0.25);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      min-height:390px;
      overflow:hidden;
    }

    /* Balloons behind penguin */
    .balloon{
      position:absolute;
      width:78px;
      height:102px;
      border-radius:50% 50% 46% 46%;
      opacity:0.72;
      z-index:1;
      animation: floaty 7s ease-in-out infinite;
    }
    .balloon:after{
      content:"";
      position:absolute;
      left:50%;
      top:102px;
      width:2px;
      height:140px;
      background: rgba(245,240,230,0.28);
      transform: translateX(-50%);
    }

    .b1{ background: rgba(216,177,90,0.92); left:8%;  top:56%; animation-delay:.1s;}
    .b2{ background: rgba(255,75,92,0.86); left:22%; top:18%; animation-delay:1.1s;}
    .b3{ background: rgba(90,220,255,0.72); right:16%; top:22%; animation-delay:2.2s;}
    .b4{ background: rgba(120,255,180,0.66); right:6%;  top:58%; animation-delay:3.0s;}
    .b5{ background: rgba(170,140,255,0.62); left:46%; top:8%;  animation-delay:2.6s; transform: scale(.88);}

    @keyframes floaty{
      0%,100%{ transform: translateY(0) rotate(-2deg); }
      50%{ transform: translateY(-20px) rotate(2deg); }
    }

    /* Penguin hop animation */
    .penguinWrap{
      position:relative;
      z-index:2;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:340px;
      margin-top:10px;
    }

    .penguinBtn{
      border:0;
      background:transparent;
      padding:0;
      cursor:pointer;
      transform-origin: 50% 85%;
      animation: hop 1.1s ease-in-out infinite;
    }
    .penguinBtn:active{ transform: scale(0.985); }

    @keyframes hop{
      0%,100% { transform: translateY(6px) scale(1); }
      50%     { transform: translateY(-12px) scale(1.02); }
    }

    .jumpOnce{
      animation: bigJump .55s cubic-bezier(.2,.9,.2,1) 1;
    }
    @keyframes bigJump{
      0%   { transform: translateY(6px) scale(1); }
      55%  { transform: translateY(-30px) scale(1.06); }
      100% { transform: translateY(6px) scale(1); }
    }

    svg.penguin{
      width:100%;
      max-width:340px;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,0.45));
      user-select:none;
    }

    /* Sparkle burst */
    .spark{
      position:absolute;
      width:6px; height:6px;
      border-radius:2px;
      background: rgba(216,177,90,0.9);
      box-shadow: 0 0 14px rgba(216,177,90,0.45);
      opacity:0;
      z-index:3;
      pointer-events:none;
      animation: popSpark 650ms ease-out forwards;
    }
    @keyframes popSpark{
      0%   { transform: translate(0,0) scale(0.8); opacity:0; }
      15%  { opacity:1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity:0; }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Happy Birthday, <span class="gold">Ooha</span> 🎂</h1>

    <div class="layout">
      <div>
        <div class="message">
          <span id="typed"></span><span id="cursor" class="cursor"></span>
        </div>

        <button id="replayBtn" class="btn">↻ Replay Message</button>
        <div style="margin-top:10px; font-size:13px; opacity:.82;">Tip: click the penguin 🐧✨</div>
      </div>

      <div class="art" id="art">
        <!-- floating balloons behind -->
        <div class="balloon b1"></div>
        <div class="balloon b2"></div>
        <div class="balloon b3"></div>
        <div class="balloon b4"></div>
        <div class="balloon b5"></div>

        <div class="penguinWrap">
          <button class="penguinBtn" id="penguinBtn" aria-label="Click the penguin">
            <!-- Penguin with birthday cap + cake -->
            <svg class="penguin" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
              <!-- shadow -->
              <ellipse cx="210" cy="392" rx="125" ry="22" fill="rgba(0,0,0,0.35)"/>

              <!-- body -->
              <ellipse cx="210" cy="250" rx="122" ry="152" fill="#0C0F18"/>
              <ellipse cx="210" cy="270" rx="84" ry="120" fill="#F5F0E6"/>

              <!-- head -->
              <ellipse cx="210" cy="154" rx="92" ry="86" fill="#0C0F18"/>
              <ellipse cx="210" cy="162" rx="66" ry="58" fill="#F5F0E6"/>

              <!-- eyes -->
              <circle cx="186" cy="148" r="10" fill="#111A2B"/>
              <circle cx="234" cy="148" r="10" fill="#111A2B"/>
              <circle cx="182" cy="144" r="3" fill="#fff"/>
              <circle cx="230" cy="144" r="3" fill="#fff"/>

              <!-- blush -->
              <ellipse cx="168" cy="170" rx="10" ry="6" fill="rgba(255,75,92,0.35)"/>
              <ellipse cx="252" cy="170" rx="10" ry="6" fill="rgba(255,75,92,0.35)"/>

              <!-- beak -->
              <path d="M210 160 L192 176 Q210 192 228 176 Z" fill="#F2A83B"/>

              <!-- smile -->
              <path d="M194 188 Q210 200 226 188" stroke="#111A2B" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>

              <!-- flippers -->
              <path d="M110 255 Q80 275 96 318 Q116 356 154 336 Q144 292 140 268 Z" fill="#0C0F18"/>
              <path d="M310 255 Q340 275 324 318 Q304 356 266 336 Q276 292 280 268 Z" fill="#0C0F18"/>

              <!-- birthday cap -->
              <g transform="translate(210 76)">
                <path d="M0 -54 L-46 18 L46 18 Z" fill="#FF4B5C"/>
                <path d="M-46 18 Q0 36 46 18" fill="rgba(255,255,255,0.22)"/>
                <circle cx="0" cy="-56" r="10" fill="#D8B15A"/>
              </g>

              <!-- cake in hands -->
              <g transform="translate(210 300)">
                <!-- plate -->
                <ellipse cx="0" cy="44" rx="58" ry="12" fill="rgba(245,240,230,0.85)"/>
                <!-- cake base -->
                <rect x="-48" y="-10" width="96" height="54" rx="14" fill="rgba(170,140,255,0.85)"/>
                <!-- frosting -->
                <path d="M-48 -10 Q-30 -26 -12 -10 Q6 -26 24 -10 Q42 -26 48 -10 Z"
                      fill="rgba(216,177,90,0.9)"/>
                <!-- candle -->
                <rect x="-6" y="-48" width="12" height="26" rx="4" fill="rgba(90,220,255,0.85)"/>
                <path d="M0 -60 C10 -52 8 -40 0 -38 C-8 -40 -10 -52 0 -60 Z" fill="#FF4B5C"/>
                <!-- sprinkles -->
                <circle cx="-26" cy="10" r="3" fill="#FF4B5C"/>
                <circle cx="0" cy="18" r="3" fill="#5AC8FA"/>
                <circle cx="24" cy="8" r="3" fill="#D8B15A"/>
              </g>

              <!-- feet -->
              <path d="M168 376 Q190 360 206 376 Q190 392 168 386 Z" fill="#F2A83B"/>
              <path d="M252 376 Q230 360 214 376 Q230 392 252 386 Z" fill="#F2A83B"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== Typewriter message =====
    const message = `Happy happy birthday, my kothi fellow 😊
To one of the most stubborn, driven, and inspiring women I know, your dedication to your dreams is honestly something I admire so much. Stay the same beautiful, hardworking, and strong person you are. Keep chasing your success, because you’re made for amazing things.
Have a day as special as you are. Meet you soon ❤️`;

    const typed = document.getElementById("typed");
    const cursor = document.getElementById("cursor");
    const replayBtn = document.getElementById("replayBtn");

    function typeEffect(){
      typed.textContent = "";
      cursor.style.display = "inline-block";
      let i = 0;

      const timer = setInterval(() => {
        typed.textContent += message.charAt(i);
        i++;
        if(i >= message.length){
          clearInterval(timer);
          cursor.style.display = "none";
        }
      }, 16);
    }

    typeEffect();
    replayBtn.addEventListener("click", typeEffect);

    // ===== Penguin click: big jump + sparkle burst =====
    const penguinBtn = document.getElementById("penguinBtn");
    const art = document.getElementById("art");

    function sparkleBurst(){
      const rect = penguinBtn.getBoundingClientRect();
      const artRect = art.getBoundingClientRect();

      // center of penguin within art
      const cx = (rect.left + rect.right)/2 - artRect.left;
      const cy = (rect.top + rect.bottom)/2 - artRect.top;

      for(let i=0;i<14;i++){
        const s = document.createElement("div");
        s.className = "spark";
        s.style.left = cx + "px";
        s.style.top  = cy + "px";
        s.style.setProperty("--dx", (Math.random()*140 - 70) + "px");
        s.style.setProperty("--dy", (Math.random()*120 - 90) + "px");
        art.appendChild(s);
        setTimeout(()=> s.remove(), 700);
      }
    }

    penguinBtn.addEventListener("click", () => {
      penguinBtn.classList.remove("jumpOnce");
      void penguinBtn.offsetWidth; // restart animation
      penguinBtn.classList.add("jumpOnce");
      sparkleBurst();
    });
  </script>
</body>
</html>
