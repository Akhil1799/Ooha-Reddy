<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Ooha 🎉</title>

  <style>
    :root{
      --bg1:#070A12;
      --bg2:#111A2B;
      --gold:#D8B15A;
      --cream:#F5F0E6;
      --accent:#FF4B5C;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 800px at 50% 25%, rgba(216,177,90,0.14), transparent 55%),
        radial-gradient(900px 700px at 20% 85%, rgba(255,75,92,0.10), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color:var(--cream);
      overflow:hidden;
      padding:22px;
    }

    .card{
      width:min(980px, 96vw);
      padding:38px;
      border-radius:24px;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(216,177,90,0.30);
      box-shadow: 0 25px 70px rgba(0,0,0,0.60);
      backdrop-filter: blur(10px);
      position:relative;
      overflow:hidden;
    }

    h1{
      margin:0 0 18px;
      font-size:clamp(30px, 4.2vw, 46px);
    }
    .gold{ color: var(--gold); }

    .layout{
      display:grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap:22px;
      align-items:start;
    }

    .message{
      border:1px dashed rgba(216,177,90,0.45);
      padding:22px;
      border-radius:16px;
      background: rgba(0,0,0,0.18);
      line-height:1.7;
      font-size:15.5px;
    }

    .type{
      white-space:pre-wrap;
    }

    .cursor{
      display:inline-block;
      width:10px;
      height:18px;
      background: rgba(245,240,230,0.65);
      margin-left:6px;
      animation: blink .8s infinite;
    }
    @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .btn{
      margin-top:12px;
      border:1px solid rgba(216,177,90,0.45);
      background: rgba(0,0,0,0.25);
      color: var(--cream);
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      font-weight:700;
    }

    .art{
      position:relative;
      border-radius:18px;
      padding:16px;
      border:1px solid rgba(216,177,90,0.25);
      min-height:360px;
    }

    .balloon{
      position:absolute;
      width:70px;
      height:90px;
      border-radius:50%;
      opacity:0.7;
    }

    .b1{background:#D8B15A; left:10px; top:40px;}
    .b2{background:#FF4B5C; right:10px; top:20px;}
    .b3{background:#5AC8FA; left:120px; top:0;}

    svg{
      width:100%;
      max-width:260px;
      display:block;
      margin:40px auto 0;
    }

    /* Floating hearts */
    .heart{
      position:fixed;
      bottom:-20px;
      font-size:18px;
      color:rgba(255,75,92,0.7);
      animation: floatUp 6s linear infinite;
    }
    @keyframes floatUp{
      to{ transform: translateY(-120vh); opacity:0; }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Happy Birthday, <span class="gold">Ooha</span> 🎂</h1>

    <div class="layout">
      <div>
        <div class="message">
          <span id="typed" class="type"></span><span id="cursor" class="cursor"></span>
        </div>

        <button id="replayBtn" class="btn">↻ Replay Message</button>
      </div>

      <div class="art">
        <div class="balloon b1"></div>
        <div class="balloon b2"></div>
        <div class="balloon b3"></div>

        <svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="210" cy="392" rx="125" ry="22" fill="rgba(0,0,0,0.35)"/>
          <ellipse cx="210" cy="250" rx="122" ry="152" fill="#0C0F18"/>
          <ellipse cx="210" cy="270" rx="84" ry="120" fill="#F5F0E6"/>
          <ellipse cx="210" cy="154" rx="92" ry="86" fill="#0C0F18"/>
          <ellipse cx="210" cy="162" rx="66" ry="58" fill="#F5F0E6"/>
          <circle cx="186" cy="148" r="10" fill="#111A2B"/>
          <circle cx="234" cy="148" r="10" fill="#111A2B"/>
          <path d="M210 160 L192 176 Q210 192 228 176 Z" fill="#F2A83B"/>
          <path d="M194 188 Q210 200 226 188" stroke="#111A2B" stroke-width="4" fill="none"/>
        </svg>
      </div>
    </div>
  </div>

  <script>
    const message = `Happy happy birthday, my kothi fellow 😊

To one of the most stubborn, driven, and inspiring women I know — your dedication to your dreams is honestly something I admire so much. Stay the same beautiful, hardworking, and strong person you are. Keep chasing your success, because you’re made for amazing things.

Have a day as special as you are. Meet you soon ❤️`;

    const typed = document.getElementById("typed");
    const cursor = document.getElementById("cursor");
    const replayBtn = document.getElementById("replayBtn");

    function typeEffect(){
      typed.textContent = "";
      cursor.style.display = "inline-block";
      let i = 0;

      const timer = setInterval(() => {
        typed.textContent += message.charAt(i);
        i++;
        if(i >= message.length){
          clearInterval(timer);
          cursor.style.display = "none";
        }
      }, 18);
    }

    typeEffect();
    replayBtn.addEventListener("click", typeEffect);
  </script>
</body>
</html>
