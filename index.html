<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Ooha 🎉</title>

  <style>
    :root{
      --bg1:#070A12;
      --bg2:#111A2B;
      --gold:#D8B15A;
      --cream:#F5F0E6;
      --accent:#FF4B5C;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 800px at 50% 25%, rgba(216,177,90,0.14), transparent 55%),
        radial-gradient(900px 700px at 20% 85%, rgba(255,75,92,0.10), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color:var(--cream);
      overflow:hidden;
      padding:22px;
    }

    /* subtle vignette */
    body:after{
      content:"";
      position:fixed;
      inset:-60px;
      background: radial-gradient(closest-side, transparent 60%, rgba(0,0,0,0.45));
      pointer-events:none;
    }

    .card{
      width:min(960px, 96vw);
      padding:38px;
      border-radius:24px;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(216,177,90,0.30);
      box-shadow: 0 25px 70px rgba(0,0,0,0.60);
      backdrop-filter: blur(10px);
      position:relative;
      overflow:hidden;

      /* dramatic entrance */
      transform: translateY(20px) scale(0.98);
      opacity:0;
      animation: cardIn 900ms cubic-bezier(.2,.9,.2,1) forwards;
    }

    @keyframes cardIn{
      to{ transform: translateY(0) scale(1); opacity:1; }
    }

    h1{
      margin:0 0 18px;
      font-size:clamp(30px, 4.2vw, 46px);
      letter-spacing:.2px;
    }
    .gold{ color: var(--gold); }

    .layout{
      display:grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap:22px;
      align-items:center;
    }
    @media (max-width: 860px){
      .layout{ grid-template-columns: 1fr; }
    }

    .message{
      border:1px dashed rgba(216,177,90,0.45);
      padding:18px;
      border-radius:16px;
      background: rgba(0,0,0,0.18);
    }
    .message h3{
      margin:0 0 8px;
      color: var(--gold);
      letter-spacing:.2px;
    }
    .message p{ margin:0; opacity:.92; line-height:1.55; }

    /* music UI */
    .musicRow{
      margin-top:14px;
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .btn{
      border:1px solid rgba(216,177,90,0.45);
      background: rgba(0,0,0,0.25);
      color: var(--cream);
      padding:10px 16px;
      border-radius:999px;
      cursor:pointer;
      font-weight:700;
      transition: transform .12s ease, opacity .12s ease;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn:active{ transform: translateY(0px) scale(.99); }

    .nowPlaying{
      font-size:13px;
      opacity:.85;
    }
    .pulse{
      display:inline-block;
      width:8px; height:8px;
      border-radius:50%;
      background: rgba(120,255,180,0.85);
      box-shadow: 0 0 14px rgba(120,255,180,0.55);
      margin-right:8px;
      transform: translateY(1px);
      animation: beat 1.1s ease-in-out infinite;
    }
    @keyframes beat{
      0%,100%{ transform: translateY(1px) scale(1); opacity:.7; }
      50%{ transform: translateY(1px) scale(1.35); opacity:1; }
    }

    /* art */
    .art{
      position:relative;
      border-radius:18px;
      padding:16px;
      border:1px solid rgba(216,177,90,0.25);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      overflow:hidden;
      min-height:360px;
    }

    .balloon{
      position:absolute;
      width:78px;
      height:102px;
      border-radius:50% 50% 46% 46%;
      opacity:0.72;
      animation: floaty 6.5s ease-in-out infinite;
      z-index:1;
    }
    .balloon:after{
      content:"";
      position:absolute;
      left:50%;
      top:102px;
      width:2px;
      height:130px;
      background: rgba(245,240,230,0.30);
      transform: translateX(-50%);
    }

    .b1{ background: rgba(216,177,90,0.92); left:6%; top:52%; animation-delay:.2s;}
    .b2{ background: rgba(255,75,92,0.86); left:18%; top:18%; animation-delay:1.1s;}
    .b3{ background: rgba(90,220,255,0.72); right:14%; top:20%; animation-delay:2.0s;}
    .b4{ background: rgba(120,255,180,0.66); right:6%; top:56%; animation-delay:2.7s;}
    .b5{ background: rgba(170,140,255,0.62); left:44%; top:6%; animation-delay:1.8s; transform: scale(.88);}

    @keyframes floaty{
      0%,100%{ transform: translateY(0) rotate(-2deg); }
      50%{ transform: translateY(-18px) rotate(2deg); }
    }

    .penguinWrap{
      position:relative;
      z-index:2;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:330px;
      opacity:0;
      transform: translateY(10px) scale(.985);
      animation: penguinIn 900ms cubic-bezier(.2,.9,.2,1) 320ms forwards;
    }
    @keyframes penguinIn{
      to{ opacity:1; transform: translateY(0) scale(1); }
    }

    svg{
      width:100%;
      max-width:340px;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,0.45));
    }

    /* optional glow when music is playing */
    .glowOn{
      box-shadow: 0 0 0 1px rgba(216,177,90,0.28), 0 30px 90px rgba(0,0,0,0.60);
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <h1>Happy Birthday, <span class="gold">Ooha</span> 🎂</h1>

    <div class="layout">
      <div>
        <div class="message">
          <h3>Your message goes here</h3>
          <p>Add your birthday message ✨</p>
        </div>

        <div class="musicRow">
          <button id="musicBtn" class="btn">▶ Play Music</button>
          <div id="np" class="nowPlaying" style="display:none;">
            <span class="pulse"></span>Now playing: <span style="color:var(--gold); font-weight:700;">Sang Rahiyo</span>
          </div>
        </div>

        <!-- IMPORTANT: your real filename (capital R) -->
        <audio id="bgMusic" loop preload="auto">
          <source src="./sang-Rahiyo.mp3" type="audio/mpeg" />
        </audio>
      </div>

      <div class="art">
        <!-- balloons behind -->
        <div class="balloon b1"></div>
        <div class="balloon b2"></div>
        <div class="balloon b3"></div>
        <div class="balloon b4"></div>
        <div class="balloon b5"></div>

        <div class="penguinWrap">
          <!-- cute penguin holding flowers -->
          <svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" aria-label="Cute penguin holding flowers">
            <ellipse cx="210" cy="392" rx="125" ry="22" fill="rgba(0,0,0,0.35)"/>

            <ellipse cx="210" cy="250" rx="122" ry="152" fill="#0C0F18"/>
            <ellipse cx="210" cy="270" rx="84" ry="120" fill="#F5F0E6"/>

            <ellipse cx="210" cy="154" rx="92" ry="86" fill="#0C0F18"/>
            <ellipse cx="210" cy="162" rx="66" ry="58" fill="#F5F0E6"/>

            <circle cx="186" cy="148" r="10" fill="#111A2B"/>
            <circle cx="234" cy="148" r="10" fill="#111A2B"/>
            <circle cx="182" cy="144" r="3" fill="#fff"/>
            <circle cx="230" cy="144" r="3" fill="#fff"/>

            <ellipse cx="168" cy="170" rx="10" ry="6" fill="rgba(255,75,92,0.35)"/>
            <ellipse cx="252" cy="170" rx="10" ry="6" fill="rgba(255,75,92,0.35)"/>

            <path d="M210 160 L192 176 Q210 192 228 176 Z" fill="#F2A83B"/>

            <!-- smile -->
            <path d="M194 188 Q210 200 226 188" stroke="#111A2B" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>

            <!-- bow -->
            <path d="M210 210 L186 198 L178 210 L186 222 Z" fill="#FF4B5C"/>
            <path d="M210 210 L234 198 L242 210 L234 222 Z" fill="#FF4B5C"/>
            <circle cx="210" cy="210" r="7" fill="#D8B15A"/>

            <!-- flowers -->
            <g transform="translate(210 300)">
              <circle cx="0" cy="0" r="11" fill="#FF4B5C"/>
              <circle cx="18" cy="-10" r="10" fill="rgba(90,220,255,0.85)"/>
              <circle cx="-18" cy="-10" r="10" fill="#D8B15A"/>
              <circle cx="30" cy="6" r="9" fill="rgba(170,140,255,0.85)"/>
              <circle cx="-30" cy="6" r="9" fill="rgba(120,255,180,0.75)"/>
              <circle cx="0" cy="0" r="4" fill="#111A2B" opacity="0.75"/>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    const music = document.getElementById('bgMusic');
    const btn = document.getElementById('musicBtn');
    const np = document.getElementById('np');
    const card = document.getElementById('card');

    let playing = false;
    let fadeTimer = null;

    function fadeInMusic(target=0.55, ms=2200){
      // start from quiet and ramp up
      music.volume = 0.02;
      const steps = 44;
      const stepTime = Math.max(20, Math.floor(ms/steps));
      const step = (target - music.volume) / steps;
      let count = 0;

      clearInterval(fadeTimer);
      fadeTimer = setInterval(() => {
        count++;
        music.volume = Math.min(target, music.volume + step);
        if(count >= steps){
          clearInterval(fadeTimer);
          fadeTimer = null;
        }
      }, stepTime);
    }

    btn.addEventListener('click', async () => {
      try{
        if(!playing){
          await music.play();
          fadeInMusic(0.55, 2200);
          playing = true;
          btn.textContent = '⏸ Pause Music';
          np.style.display = 'block';
          card.classList.add('glowOn');
        } else {
          music.pause();
          playing = false;
          btn.textContent = '▶ Play Music';
          np.style.display = 'none';
          card.classList.remove('glowOn');
        }
      } catch(e){
        alert("If it doesn’t start, hard refresh (Cmd+Shift+R) and click Play again.");
      }
    });
  </script>
</body>
</html>
