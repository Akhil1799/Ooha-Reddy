<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Ooha 🎉</title>

  <style>
    :root{
      --bg1:#070A12;
      --bg2:#111A2B;
      --gold:#D8B15A;
      --cream:#F5F0E6;
      --accent:#FF4B5C;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 800px at 50% 25%, rgba(216,177,90,0.14), transparent 55%),
        radial-gradient(900px 700px at 20% 85%, rgba(255,75,92,0.10), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color:var(--cream);
      overflow:hidden;
      padding:22px;
    }

    .card{
      width:min(980px, 96vw);
      padding:38px;
      border-radius:24px;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(216,177,90,0.30);
      box-shadow: 0 25px 70px rgba(0,0,0,0.60);
      backdrop-filter: blur(10px);
      position:relative;
      overflow:hidden;
    }

    h1{
      margin:0 0 18px;
      font-size:clamp(30px, 4.2vw, 46px);
    }
    .gold{ color: var(--gold); }

    .layout{
      display:grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap:22px;
      align-items:start;
    }
    @media (max-width: 900px){
      .layout{ grid-template-columns: 1fr; }
    }

    .message{
      border:1px dashed rgba(216,177,90,0.45);
      padding:22px;
      border-radius:16px;
      background: rgba(0,0,0,0.18);
      line-height:1.7;
      font-size:15.5px;
      white-space:pre-wrap;
    }

    .cursor{
      display:inline-block;
      width:10px;
      height:18px;
      background: rgba(245,240,230,0.65);
      margin-left:6px;
      animation: blink .8s infinite;
    }
    @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .btn{
      margin-top:12px;
      border:1px solid rgba(216,177,90,0.45);
      background: rgba(0,0,0,0.25);
      color: var(--cream);
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      font-weight:700;
    }

    .art{
      position:relative;
      border-radius:18px;
      padding:16px;
      border:1px solid rgba(216,177,90,0.25);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      min-height:410px;
      overflow:hidden;
    }

    /* Balloons behind penguin */
    .balloon{
      position:absolute;
      width:78px;
      height:102px;
      border-radius:50% 50% 46% 46%;
      opacity:0.72;
      z-index:1;
      animation: floaty 7.2s ease-in-out infinite;
    }
    .balloon:after{
      content:"";
      position:absolute;
      left:50%;
      top:102px;
      width:2px;
      height:145px;
      background: rgba(245,240,230,0.28);
      transform: translateX(-50%);
    }
    .b1{ background: rgba(216,177,90,0.92); left:8%;  top:56%; animation-delay:.1s;}
    .b2{ background: rgba(255,75,92,0.86); left:22%; top:18%; animation-delay:1.1s;}
    .b3{ background: rgba(90,220,255,0.72); right:16%; top:22%; animation-delay:2.2s;}
    .b4{ background: rgba(120,255,180,0.66); right:6%;  top:58%; animation-delay:3.0s;}
    .b5{ background: rgba(170,140,255,0.62); left:46%; top:8%;  animation-delay:2.6s; transform: scale(.88);}

    @keyframes floaty{
      0%,100%{ transform: translateY(0) rotate(-2deg); }
      50%{ transform: translateY(-22px) rotate(2deg); }
    }

    /* Dancing penguin */
    .penguinWrap{
      position:relative;
      z-index:2;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:350px;
      margin-top:6px;
    }

    .penguinBtn{
      border:0;
      background:transparent;
      padding:0;
      cursor:pointer;
      transform-origin: 50% 85%;
      animation: dance 1.25s ease-in-out infinite;
    }

    /* whole-body dance: sway + tiny hops */
    @keyframes dance{
      0%   { transform: translateY(6px) rotate(-2deg) scale(1); }
      25%  { transform: translateY(-6px) rotate(2deg)  scale(1.01); }
      50%  { transform: translateY(6px) rotate(0deg)   scale(1); }
      75%  { transform: translateY(-6px) rotate(-2deg) scale(1.01); }
      100% { transform: translateY(6px) rotate(-2deg)  scale(1); }
    }

    /* extra dance on click */
    .party{
      animation: partyDance .7s cubic-bezier(.2,.9,.2,1) 1 !important;
    }
    @keyframes partyDance{
      0%   { transform: translateY(6px) rotate(-2deg) scale(1); }
      40%  { transform: translateY(-24px) rotate(10deg) scale(1.06); }
      70%  { transform: translateY(2px) rotate(-10deg) scale(1.03); }
      100% { transform: translateY(6px) rotate(-2deg) scale(1); }
    }

    /* flippers wave (inside SVG via CSS targets) */
    .flipperL{ transform-origin: 132px 245px; animation: waveL 1.25s ease-in-out infinite; }
    .flipperR{ transform-origin: 288px 245px; animation: waveR 1.25s ease-in-out infinite; }
    @keyframes waveL{ 0%,100%{ transform: rotate(6deg);} 50%{ transform: rotate(-12deg);} }
    @keyframes waveR{ 0%,100%{ transform: rotate(-6deg);} 50%{ transform: rotate(12deg);} }

    svg.penguin{
      width:100%;
      max-width:360px;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,0.45));
      user-select:none;
    }

    /* Sparkle burst */
    .spark{
      position:absolute;
      width:6px; height:6px;
      border-radius:2px;
      background: rgba(216,177,90,0.9);
      box-shadow: 0 0 14px rgba(216,177,90,0.45);
      opacity:0;
      z-index:3;
      pointer-events:none;
      animation: popSpark 650ms ease-out forwards;
    }
    @keyframes popSpark{
      0%   { transform: translate(0,0) scale(0.8); opacity:0; }
      15%  { opacity:1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity:0; }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Happy Birthday, <span class="gold">Ooha</span> 🎂</h1>

    <div class="layout">
      <div>
        <div class="message">
          <span id="typed"></span><span id="cursor" class="cursor"></span>
        </div>

        <button id="replayBtn" class="btn">↻ Replay Message</button>
        <div style="margin-top:10px; font-size:13px; opacity:.82;">Click the penguin for extra dance 🐧✨</div>
      </div>

      <div class="art" id="art">
        <div class="balloon b1"></div>
        <div class="balloon b2"></div>
        <div class="balloon b3"></div>
        <div class="balloon b4"></div>
        <div class="balloon b5"></div>

        <div class="penguinWrap">
          <button class="penguinBtn" id="penguinBtn" aria-label="Dancing penguin">
            <!-- More “realistic” cute SVG with shading + cap + cake -->
            <svg class="penguin" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="shine" cx="35%" cy="25%" r="70%">
                  <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
                  <stop offset="55%" stop-color="rgba(255,255,255,0.06)"/>
                  <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                </radialGradient>
                <radialGradient id="belly" cx="45%" cy="35%" r="75%">
                  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
                  <stop offset="70%" stop-color="#F5F0E6" stop-opacity="0.95"/>
                  <stop offset="100%" stop-color="#E9E1D4" stop-opacity="0.95"/>
                </radialGradient>
              </defs>

              <!-- shadow -->
              <ellipse cx="210" cy="392" rx="125" ry="22" fill="rgba(0,0,0,0.35)"/>

              <!-- body with subtle highlight -->
              <ellipse cx="210" cy="252" rx="126" ry="156" fill="#0B0E16"/>
              <ellipse cx="190" cy="220" rx="130" ry="160" fill="url(#shine)" opacity="0.9"/>
              <ellipse cx="210" cy="275" rx="88" ry="124" fill="url(#belly)"/>

              <!-- head -->
              <ellipse cx="210" cy="152" rx="98" ry="92" fill="#0B0E16"/>
              <ellipse cx="210" cy="162" rx="72" ry="64" fill="url(#belly)"/>

              <!-- eyes -->
              <circle cx="184" cy="146" r="11" fill="#0F1826"/>
              <circle cx="236" cy="146" r="11" fill="#0F1826"/>
              <circle cx="180" cy="142" r="3.2" fill="#fff"/>
              <circle cx="232" cy="142" r="3.2" fill="#fff"/>

              <!-- blush -->
              <ellipse cx="165" cy="170" rx="11" ry="7" fill="rgba(255,75,92,0.30)"/>
              <ellipse cx="255" cy="170" rx="11" ry="7" fill="rgba(255,75,92,0.30)"/>

              <!-- beak -->
              <path d="M210 156 L190 176 Q210 196 230 176 Z" fill="#F2A83B" opacity="0.98"/>
              <path d="M198 192 Q210 202 222 192" stroke="rgba(15,24,38,0.7)" stroke-width="4" fill="none" stroke-linecap="round"/>

              <!-- birthday cap -->
              <g transform="translate(210 72)">
                <path d="M0 -58 L-50 20 L50 20 Z" fill="#FF4B5C"/>
                <path d="M-50 20 Q0 40 50 20" fill="rgba(255,255,255,0.20)"/>
                <circle cx="0" cy="-60" r="11" fill="#D8B15A"/>
              </g>

              <!-- flippers (animated via CSS classes) -->
              <path class="flipperL" d="M112 250 Q70 276 92 326 Q118 370 165 344 Q150 296 146 266 Z" fill="#0B0E16"/>
              <path class="flipperR" d="M308 250 Q350 276 328 326 Q302 370 255 344 Q270 296 274 266 Z" fill="#0B0E16"/>

              <!-- cake -->
              <g transform="translate(210 306)">
                <ellipse cx="0" cy="46" rx="64" ry="13" fill="rgba(245,240,230,0.86)"/>
                <rect x="-54" y="-8" width="108" height="58" rx="16" fill="rgba(170,140,255,0.88)"/>
                <path d="M-54 -8 Q-34 -28 -14 -8 Q6 -28 26 -8 Q46 -28 54 -8 Z"
                      fill="rgba(216,177,90,0.92)"/>
                <rect x="-6" y="-50" width="12" height="26" rx="4" fill="rgba(90,220,255,0.85)"/>
                <path d="M0 -62 C10 -54 9 -40 0 -38 C-9 -40 -10 -54 0 -62 Z" fill="#FF4B5C"/>
                <circle cx="-28" cy="14" r="3" fill="#FF4B5C"/>
                <circle cx="0" cy="20" r="3" fill="#5AC8FA"/>
                <circle cx="28" cy="12" r="3" fill="#D8B15A"/>
              </g>

              <!-- feet -->
              <path d="M168 376 Q190 360 206 376 Q190 392 168 386 Z" fill="#F2A83B"/>
              <path d="M252 376 Q230 360 214 376 Q230 392 252 386 Z" fill="#F2A83B"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Typewriter message
    const message = `Happy happy birthday, my kothi fellow 😊
To one of the most stubborn, driven, and inspiring women I know, your dedication to your dreams is honestly something I admire so much. Stay the same beautiful, hardworking, and strong person you are. Keep chasing your success, because you’re made for amazing things.
Have a day as special as you are. Meet you soon ❤️`;

    const typed = document.getElementById("typed");
    const cursor = document.getElementById("cursor");
    const replayBtn = document.getElementById("replayBtn");

    function typeEffect(){
      typed.textContent = "";
      cursor.style.display = "inline-block";
      let i = 0;
      const timer = setInterval(() => {
        typed.textContent += message.charAt(i);
        i++;
        if(i >= message.length){
          clearInterval(timer);
          cursor.style.display = "none";
        }
      }, 16);
    }
    typeEffect();
    replayBtn.addEventListener("click", typeEffect);

    // Click penguin: extra dance + sparkles
    const penguinBtn = document.getElementById("penguinBtn");
    const art = document.getElementById("art");

    function sparkleBurst(){
      const rect = penguinBtn.getBoundingClientRect();
      const artRect = art.getBoundingClientRect();
      const cx = (rect.left + rect.right)/2 - artRect.left;
      const cy = (rect.top + rect.bottom)/2 - artRect.top;

      for(let i=0;i<14;i++){
        const s = document.createElement("div");
        s.className = "spark";
        s.style.left = cx + "px";
        s.style.top  = cy + "px";
        s.style.setProperty("--dx", (Math.random()*150 - 75) + "px");
        s.style.setProperty("--dy", (Math.random()*130 - 95) + "px");
        art.appendChild(s);
        setTimeout(()=> s.remove(), 700);
      }
    }

    penguinBtn.addEventListener("click", () => {
      penguinBtn.classList.remove("party");
      void penguinBtn.offsetWidth;
      penguinBtn.classList.add("party");
      sparkleBurst();
    });
  </script>
</body>
</html>
