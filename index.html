<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Ooha 🎉</title>

  <style>
    :root{
      --bg1:#070A12;
      --bg2:#111A2B;
      --gold:#D8B15A;
      --cream:#F5F0E6;
      --accent:#FF4B5C;
      --soft:#9BE7FF;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 800px at 50% 25%, rgba(216,177,90,0.14), transparent 55%),
        radial-gradient(900px 700px at 20% 85%, rgba(255,75,92,0.10), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color:var(--cream);
      overflow:hidden;
      padding:22px;
    }

    .card{
      width:min(980px, 96vw);
      padding:38px;
      border-radius:24px;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(216,177,90,0.30);
      box-shadow: 0 25px 70px rgba(0,0,0,0.60);
      backdrop-filter: blur(10px);
      position:relative;
      overflow:hidden;

      transform: translateY(16px) scale(0.99);
      opacity:0;
      animation: cardIn 850ms cubic-bezier(.2,.9,.2,1) forwards;
    }

    @keyframes cardIn{
      to{ transform: translateY(0) scale(1); opacity:1; }
    }

    h1{
      margin:0 0 18px;
      font-size:clamp(30px, 4.2vw, 46px);
      letter-spacing:.2px;
    }
    .gold{ color: var(--gold); }

    .layout{
      display:grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap:22px;
      align-items:start;
    }
    @media (max-width: 900px){
      .layout{ grid-template-columns: 1fr; }
    }

    /* --- Message card (typewriter) --- */
    .message{
      border:1px dashed rgba(216,177,90,0.45);
      padding:22px;
      border-radius:16px;
      background: rgba(0,0,0,0.18);
      line-height:1.7;
      font-size:15.5px;
      position:relative;
      overflow:hidden;
    }

    .type{
      white-space:pre-wrap;
      min-height: 180px;
    }

    .cursor{
      display:inline-block;
      width:10px;
      height:18px;
      background: rgba(245,240,230,0.65);
      margin-left:6px;
      transform: translateY(3px);
      animation: blink .8s infinite;
    }
    @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

    /* --- Surprise button --- */
    .actions{
      margin-top:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn{
      border:1px solid rgba(216,177,90,0.45);
      background: rgba(0,0,0,0.25);
      color: var(--cream);
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      font-weight:700;
      transition: transform .12s ease, opacity .12s ease;
    }
    .btn:hover{ transform: translateY(-1px); }
    .hint{
      font-size:13px;
      opacity:.82;
    }

    /* --- Gallery (hidden then reveal) --- */
    .galleryWrap{
      margin-top:16px;
      display:none;
      animation: fadeUp .6s ease-out forwards;
    }
    @keyframes fadeUp{
      from{opacity:0; transform: translateY(10px)}
      to{opacity:1; transform: translateY(0)}
    }

    .gallery{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:10px;
    }
    @media (max-width: 520px){
      .gallery{ grid-template-columns: 1fr; }
    }

    .photo{
      border-radius:16px;
      overflow:hidden;
      border:1px solid rgba(216,177,90,0.28);
      background: rgba(255,255,255,0.03);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      position:relative;
    }
    .photo img{
      width:100%;
      height:220px;
      object-fit:cover;
      display:block;
      transform: scale(1.02);
      transition: transform .35s ease;
    }
    .photo:hover img{ transform: scale(1.07); }

    .cap{
      position:absolute;
      left:10px;
      bottom:10px;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      background: rgba(0,0,0,0.45);
      border:1px solid rgba(216,177,90,0.22);
      backdrop-filter: blur(8px);
    }

    /* --- Right art panel --- */
    .art{
      position:relative;
      border-radius:18px;
      padding:16px;
      border:1px solid rgba(216,177,90,0.25);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      overflow:hidden;
      min-height:420px;
    }

    .balloon{
      position:absolute;
      width:78px;
      height:102px;
      border-radius:50% 50% 46% 46%;
      opacity:0.72;
      animation: floaty 6.5s ease-in-out infinite;
      z-index:1;
    }
    .balloon:after{
      content:"";
      position:absolute;
      left:50%;
      top:102px;
      width:2px;
      height:130px;
      background: rgba(245,240,230,0.30);
      transform: translateX(-50%);
    }

    .b1{ background: rgba(216,177,90,0.92); left:6%; top:55%; animation-delay:.2s;}
    .b2{ background: rgba(255,75,92,0.86); left:18%; top:18%; animation-delay:1.1s;}
    .b3{ background: rgba(90,220,255,0.72); right:14%; top:20%; animation-delay:2.0s;}
    .b4{ background: rgba(120,255,180,0.66); right:6%; top:56%; animation-delay:2.7s;}
    .b5{ background: rgba(170,140,255,0.62); left:44%; top:6%; animation-delay:1.8s; transform: scale(.88);}

    @keyframes floaty{
      0%,100%{ transform: translateY(0) rotate(-2deg); }
      50%{ transform: translateY(-18px) rotate(2deg); }
    }

    .penguinWrap{
      position:relative;
      z-index:2;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:330px;
      margin-top:16px;
      opacity:0;
      transform: translateY(10px) scale(.985);
      animation: penguinIn 900ms cubic-bezier(.2,.9,.2,1) 260ms forwards;
    }
    @keyframes penguinIn{
      to{ opacity:1; transform: translateY(0) scale(1); }
    }

    svg.penguin{
      width:100%;
      max-width:340px;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,0.45));
    }

    /* --- Floating hearts + sparkles --- */
    .floatLayer{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
    }
    .heart, .spark{
      position:absolute;
      opacity:0.0;
      animation: rise 7.5s linear infinite;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.35));
    }
    .heart{
      font-size:18px;
      color: rgba(255,75,92,0.75);
    }
    .spark{
      width:6px; height:6px;
      border-radius:2px;
      background: rgba(216,177,90,0.85);
      box-shadow: 0 0 14px rgba(216,177,90,0.40);
    }

    @keyframes rise{
      0%   { transform: translateY(18vh) translateX(0) scale(0.9); opacity:0; }
      10%  { opacity:0.8; }
      70%  { opacity:0.25; }
      100% { transform: translateY(-120vh) translateX(18px) scale(1.15); opacity:0; }
    }

    /* tiny “surprise glow” */
    .glow{
      position:absolute;
      inset:-2px;
      border-radius:26px;
      pointer-events:none;
      background: radial-gradient(600px 240px at 20% 0%, rgba(216,177,90,0.18), transparent 60%),
                  radial-gradient(520px 220px at 80% 100%, rgba(255,75,92,0.10), transparent 55%);
      opacity:.85;
    }
  </style>
</head>

<body>
  <!-- floating hearts + sparkles -->
  <div class="floatLayer" id="floatLayer"></div>

  <div class="card">
    <div class="glow"></div>

    <h1>Happy Birthday, <span class="gold">Ooha</span> 🎂</h1>

    <div class="layout">
      <!-- LEFT: message + surprise gallery -->
      <div>
        <div class="message">
          <div id="typed" class="type"></div><span id="cursor" class="cursor"></span>
        </div>

        <div class="actions">
          <button class="btn" id="replayBtn">↻ Replay Message</button>
          <button class="btn" id="surpriseBtn">✨ Open Surprise Photos</button>
          <span class="hint">(Upload photo1.jpg…photo4.jpg in your repo root)</span>
        </div>

        <div class="galleryWrap" id="galleryWrap">
          <div class="gallery">
            <div class="photo">
              <img src="./photo1.jpg" alt="Photo 1">
              <div class="cap">Memory #1</div>
            </div>
            <div class="photo">
              <img src="./photo2.jpg" alt="Photo 2">
              <div class="cap">Memory #2</div>
            </div>
            <div class="photo">
              <img src="./photo3.jpg" alt="Photo 3">
              <div class="cap">Memory #3</div>
            </div>
            <div class="photo">
              <img src="./photo4.jpg" alt="Photo 4">
              <div class="cap">Memory #4</div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: balloons + cute penguin -->
      <div class="art">
        <div class="balloon b1"></div>
        <div class="balloon b2"></div>
        <div class="balloon b3"></div>
        <div class="balloon b4"></div>
        <div class="balloon b5"></div>

        <div class="penguinWrap">
          <svg class="penguin" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" aria-label="Cute penguin holding flowers">
            <ellipse cx="210" cy="392" rx="125" ry="22" fill="rgba(0,0,0,0.35)"/>

            <ellipse cx="210" cy="250" rx="122" ry="152" fill="#0C0F18"/>
            <ellipse cx="210" cy="270" rx="84" ry="120" fill="#F5F0E6"/>

            <ellipse cx="210" cy="154" rx="92" ry="86" fill="#0C0F18"/>
            <ellipse cx="210" cy="162" rx="66" ry="58" fill="#F5F0E6"/>

            <circle cx="186" cy="148" r="10" fill="#111A2B"/>
            <circle cx="234" cy="148" r="10" fill="#111A2B"/>
            <circle cx="182" cy="144" r="3" fill="#fff"/>
            <circle cx="230" cy="144" r="3" fill="#fff"/>

            <ellipse cx="168" cy="170" rx="10" ry="6" fill="rgba(255,75,92,0.35)"/>
            <ellipse cx="252" cy="170" rx="10" ry="6" fill="rgba(255,75,92,0.35)"/>

            <path d="M210 160 L192 176 Q210 192 228 176 Z" fill="#F2A83B"/>

            <!-- Smile -->
            <path d="M194 188 Q210 200 226 188" stroke="#111A2B" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>

            <!-- Bow -->
            <path d="M210 210 L186 198 L178 210 L186 222 Z" fill="#FF4B5C"/>
            <path d="M210 210 L234 198 L242 210 L234 222 Z" fill="#FF4B5C"/>
            <circle cx="210" cy="210" r="7" fill="#D8B15A"/>

            <!-- Flowers -->
            <g transform="translate(210 300)">
              <circle cx="0" cy="0" r="11" fill="#FF4B5C"/>
              <circle cx="18" cy="-10" r="10" fill="rgba(90,220,255,0.85)"/>
              <circle cx="-18" cy="-10" r="10" fill="#D8B15A"/>
              <circle cx="30" cy="6" r="9" fill="rgba(170,140,255,0.85)"/>
              <circle cx="-30" cy="6" r="9" fill="rgba(120,255,180,0.75)"/>
              <circle cx="0" cy="0" r="4" fill="#111A2B" opacity="0.75"/>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== Typewriter message =====
    const fullMessage =
`Happy happy birthday, my kothi fellow 😊

To one of the most stubborn, driven, and inspiring women I know — your dedication to your dreams is honestly something I admire so much. Stay the same beautiful, hardworking, and strong person you are. Keep chasing your success, because you’re made for amazing things.

Have a day as special as you are. Meet you soon ❤️`;

    const typedEl = document.getElementById('typed');
    const cursorEl = document.getElementById('cursor');
    const replayBtn = document.getElementById('replayBtn');

    let i = 0;
    let typingTimer = null;

    function typeIt(){
      clearInterval(typingTimer);
      typedEl.textContent = "";
      cursorEl.style.display = "inline-block";
      i = 0;

      typingTimer = setInterval(() => {
        typedEl.textContent += fullMessage.charAt(i);
        i++;
        if(i >= fullMessage.length){
          clearInterval(typingTimer);
          cursorEl.style.display = "none";
        }
      }, 18);
    }
    typeIt();

    replayBtn.addEventListener('click', typeIt);

    // ===== Surprise gallery toggle =====
    const surpriseBtn = document.getElementById('surpriseBtn');
    const galleryWrap = document.getElementById('galleryWrap');
    let open = false;

    surpriseBtn.addEventListener('click', () => {
      open = !open;
      galleryWrap.style.display = open ? "block" : "none";
      surpriseBtn.textContent = open ? "🙈 Hide Surprise Photos" : "✨ Open Surprise Photos";
    });

    // ===== Floating hearts + sparkles =====
    const layer = document.getElementById('floatLayer');

    function rand(min, max){ return Math.random() * (max - min) + min; }

    function spawn(){
      // hearts
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = '❤';
      h.style.left = rand(0, 100) + 'vw';
      h.style.top = rand(85, 105) + 'vh';
      h.style.animationDuration = rand(6.8, 9.5) + 's';
      h.style.animationDelay = rand(0, 2.5) + 's';
      h.style.fontSize = rand(14, 22) + 'px';
      layer.appendChild(h);

      // spark
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.left = rand(0, 100) + 'vw';
      s.style.top = rand(85, 105) + 'vh';
      s.style.animationDuration = rand(6.0, 9.0) + 's';
      s.style.animationDelay = rand(0, 2.0) + 's';
      layer.appendChild(s);

      // cleanup
      setTimeout(() => { h.remove(); s.remove(); }, 11000);
    }

    // spawn a few immediately, then continuously
    for(let k=0;k<10;k++) spawn();
    setInterval(spawn, 650);
  </script>
</body>
</html>
